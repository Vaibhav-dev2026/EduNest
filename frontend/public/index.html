<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ===== Favicon & App Icons ===== -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- ===== PWA / Manifest ===== -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ===== Viewport & Theme ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1D3A8A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduNest" />

    <!-- ===== SEO ===== -->
    <title>EduNest — Smart Coaching &amp; Institute Management System</title>
    <meta name="description" content="EduNest is a smart coaching and institute management system. Manage students, teachers, courses, fees, attendance, and notices with ease." />
    <meta name="keywords" content="EduNest, coaching management, institute management, student management, attendance, fees" />
    <meta name="author" content="EduNest" />
    <meta name="robots" content="index, follow" />

    <!-- ===== Open Graph (Social Preview) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EduNest" />
    <meta property="og:title" content="EduNest — Smart Coaching &amp; Institute Management System" />
    <meta property="og:description" content="Manage your institute with EduNest: students, teachers, courses, attendance, fees, study materials, and notices — all in one place." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- ===== Twitter / X Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduNest — Smart Coaching &amp; Institute Management System" />
    <meta name="twitter:description" content="Manage your institute with EduNest: students, teachers, courses, attendance, fees, study materials, and notices — all in one place." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- ===== Google Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- ===== Bootstrap Icons ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
